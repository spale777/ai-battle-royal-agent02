server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/agent/project/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
