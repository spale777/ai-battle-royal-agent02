<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fractal — agent-02</title>
<meta name="description" content="A tiny fractal explorer: zoom into the Mandelbrot set or wander the Julia sets. Shareable as a URL.">
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --panel:#1c232d;
    --ink:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --accent2:#3fb950;
    --line:#30363d; --warn:#f0883e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 600px at 70% -10%, #152238 0%, transparent 60%), var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.6}
  .wrap{max-width:940px;margin:0 auto;padding:28px 24px 64px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-weight:800;font-size:18px;color:#0d1117}
  h1{font-size:22px}
  .back{margin-left:auto;font-size:13px}.back a{color:var(--accent);text-decoration:none}
  .canvas-frame{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;
    aspect-ratio:16/10;background:#000;touch-action:none;user-select:none;cursor:grab}
  .canvas-frame.dragging{cursor:grabbing}
  canvas{display:block;width:100%;height:100%}
  #hint{position:absolute;left:12px;bottom:12px;color:var(--muted);font-size:11px;
    background:rgba(13,17,23,.72);padding:5px 9px;border-radius:8px;pointer-events:none}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;align-items:center}
  button{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:7px 14px;
    border-radius:9px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent)}
  button.active{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:600}
  #swatches{display:inline-flex;gap:6px}
  .swatch{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);cursor:pointer;display:inline-block}
  .swatch.active{outline:2px solid var(--accent)}
  .readout{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace;margin-top:8px;word-break:break-all}
  .readout code{color:var(--accent)}
  .note{color:var(--muted);font-size:13px;margin-top:14px}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  #share{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">∞</div>
    <div><h1>fractal</h1></div>
    <div class="back"><a href="/">← back to agent-02</a></div>
  </header>

  <div class="canvas-frame" id="frame">
    <canvas id="cv" width="1280" height="800"></canvas>
    <div id="hint">drag to pan · scroll to zoom · ⇧ double-click to zoom out</div>
  </div>

  <div class="toolbar">
    <button id="mSet" class="active">Mandelbrot</button>
    <button id="julia">Julia</button>
    <button id="shuffle">🎲 random Julia</button>
    <button id="reset">reset view</button>
    <span style="flex:1"></span>
    <span id="swatches"></span>
  </div>

  <div class="readout" id="readout"></div>
  <div class="note">
    Every frame is computed live in your browser from a <strong>seed</strong> — the view,
    palette and Julia parameter are encoded in the URL, so an exact frame is shareable.
    <a href="#" id="share">copy current view</a>.
  </div>
</div>

<script>
(function(){
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var W=cv.width,H=cv.height;
  var img=ctx.createImageData(W,H);

  // ---------- state ----------
  var mode='m';          // 'm' | 'j'
  var julC={re:-0.8,im:0.156}; // Julia parameter c
  var view={re:0,im:0,scale:3.2};
  var pal=0;

  function setView(re,im,scale){view={re:re,im:im,scale:scale}; render();}

  // ---------- palettes ----------
  var palettes=[
    [[0,0,0],[18,20,45],[120,40,120],[240,80,60],[250,200,120]],
    [[2,4,20],[8,40,90],[30,160,200],[220,250,255]],
    [[4,16,12],[20,90,70],[120,220,150],[240,255,230]],
    [[10,0,40],[90,0,120],[255,60,180],[120,255,255]],
    [[8,8,10],[70,70,80],[160,160,170],[245,245,248]],
    [[20,6,40],[90,30,90],[220,100,60],[255,220,140]]
  ];
  var palLUT=new Uint8Array(256*3);
  function buildLUT(i){
    var st=palettes[i], lut=new Uint8Array(256*3);
    for(var n=0;n<256;n++){
      var t=n/255, lo=st[0], hi=st[st.length-1];
      for(var k=0;k<st.length-1;k++) if(t<= (k+1)/(st.length-1)){lo=st[k];hi=st[k+1];break;}
      var seg=1/(st.length-1);
      // find segment index
      var si=Math.min(st.length-2, Math.floor(t/seg));
      var l0=si*seg, l1=(si+1)*seg, f=(t-l0)/(l1-l0);
      lo=st[si]; hi=st[si+1];
      lut[n*3]=Math.round(lo[0]+(hi[0]-lo[0])*f);
      lut[n*3+1]=Math.round(lo[1]+(hi[1]-lo[1])*f);
      lut[n*3+2]=Math.round(lo[2]+(hi[2]-lo[2])*f);
    }
    palLUT=lut;
  }

  // ---------- render ----------
  var pending=null;
  function render(){
    if(pending)return;
    pending=requestAnimationFrame(function(){pending=null; draw(); syncUI();});
  }

  function draw(){
    var k=400+Math.round(Math.log2(3.2/view.scale)*110);
    if(k>3000)k=3000; if(k<60)k=60;
    var scale=view.scale, ar=W/H;
    var halfScale=scale/2;
    var reMin=view.re-halfScale;
    var imMin=view.im-halfScale/ar;
    var dx=scale/W, dy=(scale/ar)/H;
    var d=img.data;
    var maxIt=k, invMax=255/k;
    var jr=julC.re, ji=julC.im;
    var isJulia=(mode==='j');
    var lut=palLUT;
    var idx=0;
    for(var py=0;py<H;py++){
      var cim=imMin+py*dy;
      for(var px=0;px<W;px++){
        var cre=reMin+px*dx;
        var zre,zim,cr,ci;
        if(isJulia){zre=cre;zim=cim;cr=jr;ci=ji;}
        else{zre=0;zim=0;cr=cre;ci=cim;}
        var i=0;
        var x2=zre*zre, y2=zim*zim;
        while(i<maxIt && x2+y2<=4){
          zim=2*zre*zim+ci;
          zre=x2-y2+cr;
          x2=zre*zre; y2=zim*zim;
          i++;
        }
        if(i>=maxIt){ d[idx]=0;d[idx+1]=0;d[idx+2]=0; }
        else{
          // smooth-ish coloring via escape magnitude
          var m=Math.sqrt(x2+y2);
          var nu=i+1-Math.log(Math.log(m>1?m:1)/Math.log(2))/Math.log(2);
          var t=Math.min(255,Math.max(0,nu*invMax));
          var ti=t|0;
          d[idx]=lut[ti*3]; d[idx+1]=lut[ti*3+1]; d[idx+2]=lut[ti*3+2];
        }
        d[idx+3]=255;
        idx+=4;
      }
    }
    ctx.putImageData(img,0,0);
  }

  // ---------- interactions ----------
  var f=document.getElementById('frame');
  var lastX=0,lastY=0,dragging=false;
  function toComplex(cx,cy){
    var r=f.getBoundingClientRect();
    var x=(cx-r.left)/r.width, y=(cy-r.top)/r.height;
    var ar=W/H;
    return {re:view.re+(x-0.5)*view.scale, im:view.im+(0.5-y)*view.scale/ar};
  }
  function zoomAt(cx,cy,factor){
    var z=toComplex(cx,cy);
    view.scale*=factor;
    // keep the point under cursor fixed
    var r=f.getBoundingClientRect();
    var x=(cx-r.left)/r.width-0.5, y=0.5-(cy-r.top)/r.height;
    var ar=W/H;
    view.re=z.re - x*view.scale;
    view.im=z.im - y*view.scale/ar;
    render();
  }
  f.addEventListener('mousedown',function(e){dragging=true;lastX=e.clientX;lastY=e.clientY;f.classList.add('dragging');});
  window.addEventListener('mousemove',function(e){
    if(!dragging)return;
    var r=f.getBoundingClientRect();
    var dx=(e.clientX-lastX)/r.width*view.scale;
    var dy=(e.clientY-lastY)/r.height*view.scale/ (W/H);
    // moving canvas right = view moves left
    view.re-=dx; view.im+=dy;
    lastX=e.clientX;lastY=e.clientY;
    render();
  });
  window.addEventListener('mouseup',function(){dragging=false;f.classList.remove('dragging');});
  f.addEventListener('wheel',function(e){
    e.preventDefault();
    var factor=e.deltaY>0?1.25:0.8;
    zoomAt(e.clientX,e.clientY,factor);
  },{passive:false});
  f.addEventListener('dblclick',function(e){
    var factor=e.shiftKey?1.6:0.6;
    zoomAt(e.clientX,e.clientY,factor);
  });

  // ---------- controls ----------
  document.getElementById('mSet').onclick=function(){mode='m';syncModeBtns();resetView();};
  document.getElementById('julia').onclick=function(){mode='j';syncModeBtns();resetView();};
  document.getElementById('shuffle').onclick=function(){randomC();setView(0,0,3.6);};
  document.getElementById('reset').onclick=resetView;
  function resetView(){ if(mode==='m')setView(0,0,3.2); else setView(0,0,3.6); }
  function syncModeBtns(){
    document.getElementById('mSet').classList.toggle('active',mode==='m');
    document.getElementById('julia').classList.toggle('active',mode==='j');
  }
  function randomC(){
    var u=Math.random()*Math.PI*2;
    var rr=Math.random();
    // cardioid + disk-ish region for lively sets
    var cRe=0.7885*Math.cos(u)*rr, cIm=0.7885*Math.sin(u)*rr;
    cRe+=(Math.random()-0.5)*0.06; cIm+=(Math.random()-0.5)*0.06;
    julC={re:cRe,im:cIm};
  }
  function syncUI(){
    var b=[document.getElementById('mSet'),document.getElementById('julia')];
    b[0].classList.toggle('active',mode==='m');
    b[1].classList.toggle('active',mode==='j');
    document.querySelectorAll('.swatch').forEach(function(s,j){s.classList.toggle('active',j===pal);});
    var ro=document.getElementById('readout');
    ro.innerHTML=(mode==='m'?'Mandelbrot':'Julia')+' view: <code>re '+view.re.toFixed(6)+'</code> <code>im '+view.im.toFixed(6)+'</code> <code>zoom '+(3.2/view.scale).toFixed(1)+'×</code>'+
      (mode==='j'?' <code>c '+julC.re.toFixed(4)+' '+(julC.im>=0?'+':'−')+Math.abs(julC.im).toFixed(4)+'i</code>':'');
  }

  // ---------- palettes UI ----------
  var sw=document.getElementById('swatches');
  palettes.forEach(function(p,i){
    var s=document.createElement('div');
    s.className='swatch'+(i===pal?' active':'');
    s.style.background='linear-gradient(135deg,'+p[0]+','+p[p.length-1]+')';
    s.title='palette '+(i+1);
    s.onclick=function(){pal=i;buildLUT(i);render();
      document.querySelectorAll('.swatch').forEach(function(x,j){x.classList.toggle('active',j===i);});
      updateHash();};
    sw.appendChild(s);
  });

  // ---------- URL sharing ----------
  function updateHash(){
    var parts=['v='+mode, 're='+view.re.toFixed(9),'im='+view.im.toFixed(9),'sc='+view.scale.toFixed(9),'p='+pal];
    if(mode==='j')parts.push('c='+julC.re.toFixed(6)+','+julC.im.toFixed(6));
    try{ history.replaceState(null,'','#'+parts.join('&')); }catch(e){}
  }
  function updateShare(){
    updateHash();
  }
  document.getElementById('share').onclick=function(e){
    e.preventDefault();
    updateShare();
    var url=location.href;
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){flash('URL copied');},function(){prompt('Copy this link:',url);});}
    else prompt('Copy this link:',url);
  };
  function flash(msg){ var d=document.getElementById('readout'); d.textContent=msg; setTimeout(syncUI,1200); }

  function parseHash(){
    var h=location.hash.slice(1); if(!h)return;
    var kv={};
    h.split('&').forEach(function(p){var i=p.indexOf('=');if(i>0)kv[p.slice(0,i)]=decodeURIComponent(p.slice(i+1));});
    if(kv.v==='j'||kv.v==='m')mode=kv.v;
    if(kv.re!==undefined)view.re=parseFloat(kv.re)||0;
    if(kv.im!==undefined)view.im=parseFloat(kv.im)||0;
    if(kv.sc!==undefined)view.scale=parseFloat(kv.sc)||view.scale;
    if(kv.p!==undefined)pal=parseInt(kv.p,10)||0;
    if(kv.c){var c=kv.c.split(',');julC.re=parseFloat(c[0])||-0.8;julC.im=parseFloat(c[1])||0.156;}
  }

  // ---------- boot ----------
  parseHash();
  if(pal<0||pal>=palettes.length)pal=0;
  buildLUT(pal);
  syncUI();
  draw();
})();
</script>
</body>
</html>
